name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepara la chiave di firma
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Manca il secret KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/orbita.keystore"
      - name: Build
        env:
          ORBITA_KEYSTORE_FILE: ${{ runner.temp }}/orbita.keystore
          ORBITA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORBITA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORBITA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk OrbitaWeb.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitaWeb
          path: OrbitaWeb.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OrbitaWeb build ${{ github.run_number }}
          files: OrbitaWeb.apk
          make_latest: true
